x-app-environment: &app-environment
  DATABASE_PATH: /runtime/app.db
  LLM_MODE: replay
  LLM_CACHE: "0"

x-app: &app
  build:
    context: .
  image: exodia:m6-t02
  environment: *app-environment
  healthcheck:
    test:
      ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8511/_stcore/health', timeout=3).read()"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 20s
  networks:
    - runtime
  security_opt:
    - no-new-privileges:true

services:
  dev:
    <<: *app
    ports:
      - "127.0.0.1:${DEV_HOST_PORT:-8511}:8511"
    volumes:
      - dev_data:/runtime

  study:
    <<: *app
    profiles: [study]
    environment:
      <<: *app-environment
      APP_MODE: private
    ports:
      - "127.0.0.1:${STUDY_HOST_PORT:-8512}:8511"
    volumes:
      - study_data:/runtime

  demo:
    <<: *app
    profiles: [demo]
    environment:
      <<: *app-environment
      APP_MODE: restricted_demo
    ports:
      - "127.0.0.1:${DEMO_HOST_PORT:-8513}:8511"
    volumes:
      - demo_data:/runtime

networks:
  runtime: {}

volumes:
  dev_data:
  study_data:
  demo_data:
